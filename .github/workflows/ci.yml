name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and dev tools
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Unit tests
        run: pytest -q

  # Runs the database tests against a real PostgreSQL, including the concurrency tests.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: orderbridge
          POSTGRES_PASSWORD: orderbridge
          POSTGRES_DB: orderbridge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orderbridge -d orderbridge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # A throwaway database that exists only for this job.
      DATABASE_URL_TEST: postgresql+psycopg://orderbridge:orderbridge@localhost:5432/orderbridge_test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and dev tools
        run: pip install -e ".[dev]"

      - name: Integration tests (real PostgreSQL)
        run: pytest -m integration -q
