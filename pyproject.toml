[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "orderbridge"
version = "0.1.0"
description = "Reliable CRM-to-ERP order integration platform"
requires-python = ">=3.14,<3.15"
dependencies = [
    "httpx>=0.28,<1",
    "pydantic-settings>=2.12,<3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.14,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a real PostgreSQL (DATABASE_URL_TEST); excluded from the default run",
]
# The default run stays offline. Run the integration tests with: pytest -m integration
addopts = "-m 'not integration'"

[tool.ruff]
target-version = "py314"
line-length = 100